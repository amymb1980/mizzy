[project]
name = "mizzy"
version = "0.0.1"
description = "Mizzy — chef-side buying layer and live costing. Unit normalisation engine."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mizzy*"]
